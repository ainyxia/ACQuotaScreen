<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="ac-token" content="{{ token }}"><title>AC 副屏控制台</title><link rel="stylesheet" href="/static/style.css"><body>
<link rel="stylesheet" href="/static/layout.css">
<link rel="stylesheet" href="/static/themes.css">
<header><strong>AC 副屏控制台</strong><span id="connection">连接中</span></header>
<script src="/static/spider-console.js" defer></script>
<script src="/static/desktop-console.js" defer></script>
<main class="console"><section><h2>副屏</h2><div class="source-panel"><label>副屏显示额度来源<select id="active-source"><option value="relay">Codex++ 中转站</option><option value="official">官方 Codex</option></select></label><small id="source-hint">这里只切换副屏显示的数据来源，不会启动或关闭任何 Codex。</small></div><div class="toolbar"><button data-usb="start">启动副屏</button><button data-usb="stop">停止输出</button><button id="refresh" title="刷新额度">刷新额度</button><a href="/screen" target="_blank">打开预览</a></div><p id="usb"></p><p id="touch"></p><iframe src="/screen" title="副屏预览"></iframe><div class="tabs"><button data-page="quota">额度</button><button data-page="hardware">硬件监控</button><button data-page="control">快捷控制</button></div></section>
<section class="appearance-section"><h2>主题与布局</h2><div class="theme-gallery" id="theme-gallery"></div><div class="layout-options" id="layout-options"></div><label>背景强度<input id="background-opacity" type="range" min="0" max="50" step="1" value="16"></label></section>
<section id="relay-settings"><h2>中转站</h2><div id="profiles"></div><form id="profile"><input name="id" type="hidden"><label>名称<input name="name" required maxlength="80"></label><label>HTTPS 地址<input name="base_url" placeholder="https://example.com" type="url" required></label><label>API Key<input name="api_key" type="password" autocomplete="new-password" placeholder="编辑时留空保留原密钥"></label><div class="toolbar"><button type="submit">保存中转站</button><button type="reset">新增</button></div></form><details><summary>CCS 配置导入</summary><form id="import"><label>CC-Switch 导入链接<textarea name="link" rows="3" required spellcheck="false"></textarea></label><button>导入配置</button></form></details></section>
<section><h2>显示设置</h2><form id="settings"><label>额度刷新间隔（秒）<input name="refresh_seconds" type="number" min="15" max="3600" value="30"></label><label>画面旋转<select name="screen_rotation"><option value="270">270°（横向）</option><option value="90">90°（横向反转）</option><option value="0">0°（竖向）</option><option value="180">180°（竖向反转）</option></select></label><label>自定义文字<input name="custom_text" maxlength="120"></label><label class="check"><input name="hour12" type="checkbox">12 小时制</label><label>快捷应用（名称 | 完整 EXE 或 LNK 路径）<textarea name="shortcuts" rows="4" placeholder="记事本 | C:\Windows\notepad.exe"></textarea></label><button>保存显示设置</button></form></section>
<section><h2>背景与主题</h2><form data-upload="media"><label>图片 / 视频<input type="file" name="file" accept=".jpg,.jpeg,.png,.webp,.gif,.mp4,.webm" required></label><button>应用背景</button><button type="button" data-reset="media">清除背景</button></form><details><summary>自定义样式表（CSS）</summary><form data-upload="css"><input type="file" name="file" accept=".css" required><button>应用样式表</button><button type="button" data-reset="css">恢复默认</button></form></details></section></main><output id="notice" role="status"></output><script src="/static/console.js"></script></body></html>
